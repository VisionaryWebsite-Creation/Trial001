<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>3D Book Viewer</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #222; }
  #hint { position: fixed; top: 10px; left: 10px; color: #ccc; font: 13px sans-serif; }
</style>
</head>
<body>
<div id="hint">Drag the front cover or a page edge to open/close it. Scroll to zoom, right-drag to orbit.</div>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

// ============================================================
// CONFIG — must match the Blender build
// ============================================================
const N_LEAVES = 100;
const GLB_PATH = "book.glb"; // put book.glb next to this html file to test locally

// Blender's local Z rotation (our hinge axis) becomes local Y after the
// standard Z-up -> Y-up glTF export conversion.
// If the cover opens the WRONG way once you test this, flip COVER_SIGN.
// If pages open the wrong way (independent of the cover), flip PAGE_SIGN.
const COVER_SIGN = -1;
const PAGE_SIGN = -1;

// Curl settings for pages while they're mid-turn. This is what keeps a
// turning page's leading edge from sweeping through the space the next
// (still-closed) page occupies -- a flat rigid page has no way to avoid
// that, a curling one does.
const BEND = {
  strength: 0.35, // fraction of the page (0-1) that participates in the curl at the peak of the turn
  radius: 0.9,    // curl radius, in inches
  turns: 2.0,     // how far the curled portion wraps around, in radians
  zSign: 1,       // flip to -1 if the curl bulges the wrong way once you see it
};

// How much a page/cover curls at the midpoint of its swing (radians of
// extra curl at the very tip, peaking at 90 degrees open, zero at 0 and
// 180). This is what keeps a page that's longer than the book is thick
// from sweeping straight through the rest of the book on its way open.
// Covers are rigid boards in real life so they only get a small crease
// near the spine, not a full curl.
const PAGE_BEND_STRENGTH = 0.9;
const COVER_BEND_STRENGTH = 0.15;
// If the curl looks backwards (bulging away from the book instead of
// tucking in toward the spine), flip this to -1.
const BEND_SIGN = 1;

// ============================================================
// SCENE
// ============================================================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x222222);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.01, 100);
camera.position.set(0, 8, 18);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0);
controls.mouseButtons = { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.ROTATE };
// Left-drag orbits by default; grabbing the cover or a page (see pick())
// disables controls for the duration of that drag so the two don't fight.

scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(5, 10, 8);
scene.add(sun);

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ============================================================
// LOAD BOOK
// ============================================================
let bookRoot = null;
let frontCover = null;
let backCover = null;
const pages = []; // pages[0] = Page_001, ... in order

// Each rotating part has: node (the Object3D), target (degrees the user
// is asking for), and actual (degrees it's actually allowed, after
// clamping against whatever is in front of it in the chain).
const state = new Map(); // node -> { target, actual, sign }

function nameFor(i) {
  return "Page_" + String(i + 1).padStart(3, "0");
}

new GLTFLoader().load(GLB_PATH, (gltf) => {
  scene.add(gltf.scene);
  bookRoot = gltf.scene.getObjectByName("Book_Root") || gltf.scene;

  frontCover = gltf.scene.getObjectByName("Front_Cover");
  backCover = gltf.scene.getObjectByName("Back_Cover");

  state.set(frontCover, { target: 0, actual: 0, sign: COVER_SIGN, parent: null });

  for (let i = 0; i < N_LEAVES; i++) {
    const node = gltf.scene.getObjectByName(nameFor(i));
    if (!node) { console.warn("Missing node:", nameFor(i)); continue; }
    pages.push(node);
    const parentNode = i === 0 ? frontCover : pages[i - 1];
    state.set(node, { target: 0, actual: 0, sign: PAGE_SIGN, parent: parentNode });
    setupBendData(node);
  }

  recomputeChain();
  console.log("Book loaded:", pages.length, "pages found.");
}, undefined, (err) => console.error("Failed to load", GLB_PATH, err));

// ============================================================
// PAGE BENDING
// A page's local X = distance from the hinge, Z = thickness. We keep a
// clean flat copy of the vertex positions from load time, and every time a
// page's angle changes, recompute the live positions from that clean copy
// (never accumulate bend on top of bend). Only the portion of the page
// past flatEndT curls; the rest stays perfectly flat against the hinge.
// ============================================================
function findMesh(node) {
  if (node.isMesh) return node;
  let found = null;
  node.traverse((child) => { if (!found && child.isMesh) found = child; });
  return found;
}

function setupBendData(node) {
  const mesh = findMesh(node);
  if (!mesh) { console.warn("No mesh geometry found for", node.name); return; }
  const geom = mesh.geometry;
  geom.computeBoundingBox();
  const bb = geom.boundingBox;
  const rest = Float32Array.from(geom.attributes.position.array);
  state.get(node).bend = { mesh, geom, rest, minX: bb.min.x, length: bb.max.x - bb.min.x };
}

function applyBend(node) {
  const s = state.get(node);
  const b = s.bend;
  if (!b || b.length <= 0) return;
  const actual = s.actual;

  if (actual <= 0.001 || actual >= 179.999) { resetFlat(node); return; }

  const rollFraction = Math.min(1, Math.sin(THREE.MathUtils.degToRad(actual)) * BEND.strength);
  const flatEndT = 1 - rollFraction;
  const arr = b.geom.attributes.position.array;
  const rest = b.rest;

  for (let i = 0; i < arr.length; i += 3) {
    const x0 = rest[i] - b.minX;
    const t = x0 / b.length;

    if (t <= flatEndT || rollFraction <= 0.001) {
      arr[i] = rest[i];
      arr[i + 1] = rest[i + 1];
      arr[i + 2] = rest[i + 2];
    } else {
      const s2 = (t - flatEndT) / (1 - flatEndT);
      const curlAngle = s2 * BEND.turns;
      arr[i] = b.minX + flatEndT * b.length + BEND.radius * Math.sin(curlAngle);
      arr[i + 1] = rest[i + 1];
      arr[i + 2] = rest[i + 2] + BEND.zSign * BEND.radius * (1 - Math.cos(curlAngle));
    }
  }
  b.geom.attributes.position.needsUpdate = true;
  b.geom.computeVertexNormals();
}

function resetFlat(node) {
  const s = state.get(node);
  const b = s.bend;
  if (!b) return;
  const arr = b.geom.attributes.position.array;
  let alreadyFlat = true;
  for (let i = 0; i < arr.length; i++) {
    if (arr[i] !== b.rest[i]) { alreadyFlat = false; break; }
  }
  if (alreadyFlat) return;
  arr.set(b.rest);
  b.geom.attributes.position.needsUpdate = true;
  b.geom.computeVertexNormals();
}

// ============================================================
// THE CLAMP / CASCADE RULE
// (this replaces the old Blender driver expressions)
// ============================================================
function recomputeChain() {
  if (!frontCover) return;

  const frontState = state.get(frontCover);
  frontState.actual = THREE.MathUtils.clamp(frontState.target, 0, 180);
  frontCover.rotation.y = frontState.sign * THREE.MathUtils.degToRad(frontState.actual);

  for (const page of pages) {
    const s = state.get(page);
    const parentS = state.get(s.parent);
    // a page can never open further than whatever is currently in front of
    // it — and if that thing closes past where this page currently sits,
    // this page's ceiling drops too, so it gets carried closed (cascade)
    s.actual = Math.min(THREE.MathUtils.clamp(s.target, 0, 180), parentS.actual);
    page.rotation.y = s.sign * THREE.MathUtils.degToRad(s.actual);
    applyBend(page);
  }
}

// Call this from your own UI/drag code:
//   setTarget(frontCover, 180)     // open the cover fully
//   setTarget(pages[0], 90)        // open page 1 halfway (clamped by cover)
//   setTarget(frontCover, 20)      // close the cover most of the way — any
//                                     pages currently open past 20 get carried
//                                     closed with it automatically
window.setTarget = function (node, degrees) {
  const s = state.get(node);
  if (!s) return;
  s.target = degrees;
  recomputeChain();
};
window.getPage = (i) => pages[i];
window.frontCover = () => frontCover;
window.backCover = () => backCover;

// ============================================================
// BASIC DRAG-TO-OPEN INTERACTION
// Left-drag horizontally on the front cover or a page to open/close it.
// This is a straightforward starting point — refine the sensitivity /
// picking logic to taste once the core rotation is confirmed correct.
// ============================================================
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let dragging = null; // { node, startX, startAngle }

// A page is only grabbable once it's actually reachable: page 1 always is,
// and any later page becomes grabbable once the page before it has opened
// at least a little (or is already partway open itself, so you can close
// it again). This mirrors a real book -- you can't grab page 5 while pages
// 1-4 are still shut flush on top of it -- and it's what stops a click from
// accidentally landing on the wrong page when everything is closed flush.
function grabbableNodes() {
  const list = [frontCover];
  pages.forEach((p, i) => {
    const s = state.get(p);
    const prevActual = i === 0 ? state.get(frontCover).actual : state.get(pages[i - 1]).actual;
    if (i === 0 || prevActual > 0.001 || s.actual > 0.001) list.push(p);
  });
  return list.filter(Boolean);
}

function pick(clientX, clientY) {
  const rect = renderer.domElement.getBoundingClientRect();
  pointer.x = ((clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(grabbableNodes(), true);
  if (hits.length === 0) return null;
  // walk up to the named rotating node (children of the actual mesh)
  let obj = hits[0].object;
  while (obj && !state.has(obj)) obj = obj.parent;
  return obj || null;
}

// Capture phase + stopImmediatePropagation so we decide whether this is a
// page-grab BEFORE OrbitControls gets a chance to start its own drag on the
// same left button.
renderer.domElement.addEventListener("pointerdown", (e) => {
  if (e.button !== 0) return;
  const node = pick(e.clientX, e.clientY);
  if (!node) return; // missed the book -> let OrbitControls orbit as normal
  dragging = { node, startX: e.clientX, startAngle: state.get(node).target };
  controls.enabled = false;
  e.stopImmediatePropagation();
}, { capture: true });

window.addEventListener("pointermove", (e) => {
  if (!dragging) return;
  const dx = e.clientX - dragging.startX;
  const degreesPerPixel = -0.5; // negative: dragging LEFT opens, RIGHT closes
  const next = dragging.startAngle + dx * degreesPerPixel;
  window.setTarget(dragging.node, THREE.MathUtils.clamp(next, 0, 180));
});

window.addEventListener("pointerup", () => {
  dragging = null;
  controls.enabled = true;
});

// ============================================================
// RENDER LOOP
// ============================================================
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>3D Book</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1a1a; touch-action: none; }
  #canvas-container { width: 100%; height: 100%; }
  #status {
    position: fixed; top: 12px; left: 12px; color: #ddd;
    font-family: system-ui, sans-serif; font-size: 14px;
    background: rgba(0,0,0,0.5); padding: 6px 10px; border-radius: 6px;
    max-width: 60vw;
  }
</style>
</head>
<body>
<div id="canvas-container"></div>
<div id="status">Loading book...</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const container = document.getElementById("canvas-container");
const statusEl = document.getElementById("status");

// ============================================================
// CONFIG -- matches your Blender rig
// ============================================================
const NUM_LEAVES = 15;
const MAX_COVER_ANGLE = 155;
const ROTATION_AXIS = "y";
const DRAG_PIXELS_FOR_FULL_SWING = 260;
const LERP_SPEED = 10;

// ---- Lighting/material tuning (this is what fixes the white-out) ----
const TONE_EXPOSURE = 0.85;      // overall brightness -- lower if still blowing out
const ENV_MAP_INTENSITY = 0.25;  // how strongly the room-reflection affects materials -- lower = less glare
const KEY_LIGHT_INTENSITY = 0.6; // was 1.2
const FILL_LIGHT_INTENSITY = 0.25; // was 0.4
const MIN_ROUGHNESS = 0.65;      // force materials to be less glossy/mirror-like

const PAGE_NAMES = Array.from({ length: NUM_LEAVES }, (_, i) => `Page_${String(i + 1).padStart(2, "0")}`);
const ALL_NAMES = ["Cover_Front", "Cover_Back", ...PAGE_NAMES];

const DRAG_SIGN = { Cover_Front: -1, Cover_Back: 1 };
PAGE_NAMES.forEach((n) => { DRAG_SIGN[n] = -1; });

const current = {};
const target = {};
ALL_NAMES.forEach((n) => { current[n] = 0; target[n] = 0; });

// ============================================================
// Renderer / Scene / Camera
// ============================================================
const renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = TONE_EXPOSURE;
renderer.outputColorSpace = THREE.SRGBColorSpace;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a1a);

const camera = new THREE.PerspectiveCamera(40, container.clientWidth / container.clientHeight, 0.05, 2.5);
camera.position.set(0.35, 0.25, 0.45);

const pmremGenerator = new THREE.PMREMGenerator(renderer);
scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;

const keyLight = new THREE.DirectionalLight(0xffffff, KEY_LIGHT_INTENSITY);
keyLight.position.set(1, 1.5, 1);
scene.add(keyLight);
const fillLight = new THREE.DirectionalLight(0xffffff, FILL_LIGHT_INTENSITY);
fillLight.position.set(-1, 0.5, -0.5);
scene.add(fillLight);
scene.add(new THREE.AmbientLight(0xffffff, 0.3));

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;

// ============================================================
// Load book
// ============================================================
const GLB_PATH = "book.glb";
const loader = new GLTFLoader();
const nodes = {};

loader.load(
  GLB_PATH,
  (gltf) => {
    const bookRoot = gltf.scene;
    scene.add(bookRoot);

    // Tame material glossiness on every mesh so grazing-angle reflections
    // don't blow the texture out to white as pages rotate.
    bookRoot.traverse((obj) => {
      if (obj.isMesh && obj.material) {
        const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
        mats.forEach((m) => {
          if ("roughness" in m) m.roughness = Math.max(m.roughness, MIN_ROUGHNESS);
          if ("metalness" in m) m.metalness = Math.min(m.metalness, 0.05);
          if ("envMapIntensity" in m) m.envMapIntensity = ENV_MAP_INTENSITY;
        });
      }
    });

    const box = new THREE.Box3().setFromObject(bookRoot);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    bookRoot.position.sub(center);

    const maxDim = Math.max(size.x, size.y, size.z);
    camera.position.set(maxDim * 1.4, maxDim * 1.0, maxDim * 1.8);
    controls.target.set(0, 0, 0);
    controls.minDistance = maxDim * 0.5;
    controls.maxDistance = maxDim * 4;
    controls.update();

    let found = 0;
    ALL_NAMES.forEach((name) => {
      const obj = bookRoot.getObjectByName(name);
      if (obj) { nodes[name] = obj; found++; }
      else console.warn(`Could not find node named "${name}" in the GLB.`);
    });

    statusEl.textContent = `Loaded. Found ${found}/${ALL_NAMES.length} controllable parts. Drag the cover to open.`;
  },
  (progress) => {
    if (progress.total) statusEl.textContent = `Loading book... ${Math.round((progress.loaded / progress.total) * 100)}%`;
  },
  (error) => {
    statusEl.textContent = "Failed to load book.glb -- check filename/path (see console).";
    console.error(error);
  }
);

// ============================================================
// Angle application
// ============================================================
function allowedMax(name) {
  if (name === "Cover_Front" || name === "Cover_Back") return MAX_COVER_ANGLE;
  const idx = PAGE_NAMES.indexOf(name);
  const prevName = idx === 0 ? "Cover_Front" : PAGE_NAMES[idx - 1];
  return current[prevName] ?? 0;
}

function applyRotation(name, obj) {
  const deg = current[name];
  const sign = name === "Cover_Back" ? 1 : -1;
  obj.rotation[ROTATION_AXIS] = sign * THREE.MathUtils.degToRad(deg);
}

// ============================================================
// Drag interaction
// ============================================================
const raycaster = new THREE.Raycaster();
const pointerNDC = new THREE.Vector2();
let dragging = null;

function setPointerFromEvent(ev) {
  const rect = renderer.domElement.getBoundingClientRect();
  pointerNDC.x = ((ev.clientX - rect.left) / rect.width) * 2 - 1;
  pointerNDC.y = -((ev.clientY - rect.top) / rect.height) * 2 + 1;
}

function pickControllableName(ev) {
  setPointerFromEvent(ev);
  raycaster.setFromCamera(pointerNDC, camera);
  const meshes = Object.values(nodes);
  const hits = raycaster.intersectObjects(meshes, true);
  if (hits.length === 0) return null;
  let obj = hits[0].object;
  while (obj) {
    if (ALL_NAMES.includes(obj.name)) return obj.name;
    obj = obj.parent;
  }
  return null;
}

renderer.domElement.addEventListener("pointerdown", (ev) => {
  const name = pickControllableName(ev);
  if (!name) return;
  dragging = { name, startX: ev.clientX, startAngle: current[name] };
  controls.enabled = false;
  renderer.domElement.setPointerCapture(ev.pointerId);
});

renderer.domElement.addEventListener("pointermove", (ev) => {
  if (!dragging) return;
  const deltaPx = (ev.clientX - dragging.startX) * DRAG_SIGN[dragging.name];
  const deltaDeg = (deltaPx / DRAG_PIXELS_FOR_FULL_SWING) * MAX_COVER_ANGLE;
  const proposed = THREE.MathUtils.clamp(dragging.startAngle + deltaDeg, 0, allowedMax(dragging.name));
  target[dragging.name] = proposed;
});

function endDrag(ev) {
  if (!dragging) return;
  try { renderer.domElement.releasePointerCapture(ev.pointerId); } catch (e) {}
  dragging = null;
  controls.enabled = true;
}
renderer.domElement.addEventListener("pointerup", endDrag);
renderer.domElement.addEventListener("pointercancel", endDrag);

// ============================================================
// Resize
// ============================================================
window.addEventListener("resize", () => {
  camera.aspect = container.clientWidth / container.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
});

// ============================================================
// Render loop
// ============================================================
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();

  ["Cover_Front", "Cover_Back", ...PAGE_NAMES].forEach((name) => {
    target[name] = THREE.MathUtils.clamp(target[name], 0, allowedMax(name));

    if (dragging && dragging.name === name) {
      current[name] = THREE.MathUtils.damp(current[name], target[name], LERP_SPEED, dt);
    } else {
      current[name] = Math.min(current[name], allowedMax(name));
      if (!dragging) {
        current[name] = THREE.MathUtils.damp(current[name], target[name], LERP_SPEED, dt);
      }
    }

    const obj = nodes[name];
    if (obj) applyRotation(name, obj);
  });

  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>

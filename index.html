<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>3D Book Viewer</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #222; }
  #hint { position: fixed; top: 10px; left: 10px; color: #ccc; font: 13px sans-serif; }
</style>
</head>
<body>
<div id="hint">Drag the front cover or a page edge to open/close it. Scroll to zoom, right-drag to orbit.</div>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

// ============================================================
// CONFIG — must match the Blender build
// ============================================================
const N_LEAVES = 100;
const GLB_PATH = "book.glb"; // put book.glb next to this html file to test locally

// Blender's local Z rotation (our hinge axis) becomes local Y after the
// standard Z-up -> Y-up glTF export conversion.
// If the cover opens the WRONG way once you test this, flip COVER_SIGN.
// If pages open the wrong way (independent of the cover), flip PAGE_SIGN.
const COVER_SIGN = 1;
const PAGE_SIGN = -1;

// ============================================================
// SCENE
// ============================================================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x222222);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.01, 100);
camera.position.set(0, 8, 18);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0);
controls.mouseButtons = { LEFT: null, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.ROTATE };

scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(5, 10, 8);
scene.add(sun);

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ============================================================
// LOAD BOOK
// ============================================================
let bookRoot = null;
let frontCover = null;
let backCover = null;
const pages = []; // pages[0] = Page_001, ... in order

// Each rotating part has: node (the Object3D), target (degrees the user
// is asking for), and actual (degrees it's actually allowed, after
// clamping against whatever is in front of it in the chain).
const state = new Map(); // node -> { target, actual, sign }

function nameFor(i) {
  return "Page_" + String(i + 1).padStart(3, "0");
}

new GLTFLoader().load(GLB_PATH, (gltf) => {
  scene.add(gltf.scene);
  bookRoot = gltf.scene.getObjectByName("Book_Root") || gltf.scene;

  frontCover = gltf.scene.getObjectByName("Front_Cover");
  backCover = gltf.scene.getObjectByName("Back_Cover");

  state.set(frontCover, { target: 0, actual: 0, sign: COVER_SIGN, parent: null });

  for (let i = 0; i < N_LEAVES; i++) {
    const node = gltf.scene.getObjectByName(nameFor(i));
    if (!node) { console.warn("Missing node:", nameFor(i)); continue; }
    pages.push(node);
    const parentNode = i === 0 ? frontCover : pages[i - 1];
    state.set(node, { target: 0, actual: 0, sign: PAGE_SIGN, parent: parentNode });
  }

  recomputeChain();
  console.log("Book loaded:", pages.length, "pages found.");
}, undefined, (err) => console.error("Failed to load", GLB_PATH, err));

// ============================================================
// THE CLAMP / CASCADE RULE
// (this replaces the old Blender driver expressions)
// ============================================================
function recomputeChain() {
  if (!frontCover) return;

  const frontState = state.get(frontCover);
  frontState.actual = THREE.MathUtils.clamp(frontState.target, 0, 180);
  frontCover.rotation.y = frontState.sign * THREE.MathUtils.degToRad(frontState.actual);

  for (const page of pages) {
    const s = state.get(page);
    const parentS = state.get(s.parent);
    // a page can never open further than whatever is currently in front of
    // it — and if that thing closes past where this page currently sits,
    // this page's ceiling drops too, so it gets carried closed (cascade)
    s.actual = Math.min(THREE.MathUtils.clamp(s.target, 0, 180), parentS.actual);
    page.rotation.y = s.sign * THREE.MathUtils.degToRad(s.actual);
  }
}

// Call this from your own UI/drag code:
//   setTarget(frontCover, 180)     // open the cover fully
//   setTarget(pages[0], 90)        // open page 1 halfway (clamped by cover)
//   setTarget(frontCover, 20)      // close the cover most of the way — any
//                                     pages currently open past 20 get carried
//                                     closed with it automatically
window.setTarget = function (node, degrees) {
  const s = state.get(node);
  if (!s) return;
  s.target = degrees;
  recomputeChain();
};
window.getPage = (i) => pages[i];
window.frontCover = () => frontCover;
window.backCover = () => backCover;

// ============================================================
// BASIC DRAG-TO-OPEN INTERACTION
// Left-drag horizontally on the front cover or a page to open/close it.
// This is a straightforward starting point — refine the sensitivity /
// picking logic to taste once the core rotation is confirmed correct.
// ============================================================
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let dragging = null; // { node, startX, startAngle }

function pick(clientX, clientY) {
  const rect = renderer.domElement.getBoundingClientRect();
  pointer.x = ((clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects([frontCover, ...pages].filter(Boolean), true);
  if (hits.length === 0) return null;
  // walk up to the named rotating node (children of the actual mesh)
  let obj = hits[0].object;
  while (obj && !state.has(obj)) obj = obj.parent;
  return obj || null;
}

renderer.domElement.addEventListener("pointerdown", (e) => {
  if (e.button !== 0) return; // left button only, right-drag reserved for orbit
  const node = pick(e.clientX, e.clientY);
  if (!node) return;
  dragging = { node, startX: e.clientX, startAngle: state.get(node).target };
  controls.enabled = false;
});

window.addEventListener("pointermove", (e) => {
  if (!dragging) return;
  const dx = e.clientX - dragging.startX;
  const degreesPerPixel = 0.5; // tune to taste
  const next = dragging.startAngle + dx * degreesPerPixel;
  window.setTarget(dragging.node, THREE.MathUtils.clamp(next, 0, 180));
});

window.addEventListener("pointerup", () => {
  dragging = null;
  controls.enabled = true;
});

// ============================================================
// RENDER LOOP
// ============================================================
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
